name: audit-capture
on:
  push:
    branches: [audit/capture]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL: 8
      OUT: out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.56.1 axe-core@4.10.2 && npx playwright install --with-deps chromium
      - run: node audit/capture.js
        continue-on-error: true
      - run: bash audit/lh.sh
        continue-on-error: true
      - if: matrix.shard == 0
        run: bash audit/assets.sh; bash audit/psi.sh
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-${{ matrix.shard }}", path: out, retention-days: 3 }
  publish:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: collected, merge-multiple: true }
      - run: |
          cd collected
          git init -q -b audit/results
          git config user.name "galaxy-audit-bot"; git config user.email "audit@galaxyinfo.us"
          git add -A && git commit -qm "audit capture results" 
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit/results
